# ====================
# Semua Bisa AI - Development Docker Compose
# ====================
# Usage: make dev (or docker compose up --build)

services:
  # ====================
  # Backend (Go + Echo)
  # ====================
  backend:
    build:
      context: ./backend
      target: dev
    container_name: semuabisaai-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/semuabisaai.db}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - go_modules:/go/pkg/mod

  # ====================
  # Frontend (React + Vite)
  # ====================
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: semuabisaai-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  go_modules:
