# Air - Hot Reload for Go
# Documentation: https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  # Build command
  cmd = "go build -o ./tmp/main ./cmd/server"
  # Binary file
  bin = "./tmp/main"
  # Delay before rebuild (milliseconds)
  delay = 1000
  # File extensions to watch
  include_ext = ["go", "tpl", "tmpl", "html"]
  # Directories to exclude
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "data"]
  # Regex patterns to exclude
  exclude_regex = ["_test.go"]
  # Exclude unchanged files
  exclude_unchanged = false
  # Follow symlinks
  follow_symlink = false
  # Stop running old binary before building
  kill_delay = "0s"
  # Build error log file
  log = "build-errors.log"
  # Delay before rerun (milliseconds)
  rerun_delay = 500
  # Send interrupt signal before kill
  send_interrupt = false
  # Arguments passed to binary
  args_bin = []
  # Full binary path
  full_bin = ""
  # Watch files in directories listed in .gitignore
  include_file = []

[log]
  # Show log time
  time = false
  # Only show main log
  main_only = false

[color]
  # Build log color
  build = "yellow"
  # Main log color
  main = "magenta"
  # Runner log color
  runner = "green"
  # Watcher log color
  watcher = "cyan"

[misc]
  # Delete tmp directory on exit
  clean_on_exit = true

[screen]
  # Clear screen on rebuild
  clear_on_rebuild = true
  # Keep scroll position
  keep_scroll = true
