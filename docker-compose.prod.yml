# ====================
# Fastship - Production Docker Compose
# ====================
# Usage: make prod-up (or docker compose -f docker-compose.prod.yml up --build -d)

services:
  # ====================
  # PostgreSQL Database
  # ====================
  db:
    image: postgres:16-alpine
    container_name: fastship-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fastship}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fastship_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fastship}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ====================
  # Backend (Go + Echo)
  # ====================
  backend:
    build:
      context: ./backend
      target: prod
    container_name: fastship-prod-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fastship}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fastship_db}?sslmode=disable
      BACKEND_PORT: 8080
      BACKEND_HOST: 0.0.0.0
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ====================
  # Caddy (Reverse Proxy + Auto SSL)
  # ====================
  caddy:
    image: caddy:2-alpine
    container_name: fastship-prod-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
