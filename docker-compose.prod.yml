# ====================
# Semua Bisa AI - Production Docker Compose
# ====================
# Usage: make prod-up (or docker compose -f docker-compose.prod.yml up --build -d)

services:
  # ====================
  # Backend (Go + Echo)
  # ====================
  backend:
    build:
      context: ./backend
      target: prod
    container_name: semuabisaai-prod-backend
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/semuabisaai.db
      BACKEND_PORT: 8080
      BACKEND_HOST: 0.0.0.0
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    volumes:
      - sqlite_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ====================
  # Caddy (Reverse Proxy + Auto SSL)
  # ====================
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: semuabisaai-prod-caddy
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?Set DOMAIN_NAME in the root .env}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${BIND_ADDRESS:-0.0.0.0}:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  sqlite_data:
  caddy_data:
  caddy_config:
